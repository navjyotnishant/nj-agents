<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" width="1180" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif" role="img" aria-label="Nothing sensitive reaches the repo.. Capture, detect, redact — then verify the redaction actually covered every flagged region before a single file is written.">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#ffedd5"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef2f2"/><stop offset="1" stop-color="#fee2e2"/></linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="nt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/></marker>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>
  <style>
    .t{fill:#0f172a}.h1{font-size:21px;font-weight:700}.lede{font-size:13px;fill:#475569}
    .ph{font-size:15.5px;font-weight:670}.cap{font-size:10.5px;fill:#64748b}
    .band{font-size:9px;font-weight:700;letter-spacing:.10em;fill:#94a3b8}
    .hx{font-size:9.5px;font-weight:600;fill:#9a3412}.big{font-size:22px;font-weight:700}
    .lg{font-size:10.5px;fill:#64748b}.kick{font-size:9px;font-weight:700;letter-spacing:.10em}
    @media (prefers-color-scheme: dark){.t{fill:#e2e8f0}.lede{fill:#cbd5e1}.cap{fill:#94a3b8}.lg{fill:#94a3b8}.hx{fill:#fdba74}}
  </style>

  <path d="M14 13 Q590 9 1166 14 Q1170 200 1166 386 Q590 391 14 386 Q10 200 14 13 Z" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round" opacity="0.85"/>
  <text class="t h1" x="40" y="42">Nothing sensitive reaches the repo.</text>
  <text class="lede" x="40" y="68">Capture, detect, redact — then verify the redaction actually covered every flagged region before a single file is written.</text>
  <text class="band" x="40" y="104">SOURCE</text>
  <g filter="url(#sh)"><rect x="40" y="120" width="170" height="92" rx="13" fill="url(#nt)" stroke="#cbd5e1"/></g>
  <text class="ph" x="60" y="154" fill="#0f172a">A capture</text>
  <text class="cap" x="60" y="176">app · terminal ·</text>
  <text class="cap" x="60" y="193">component · existing</text>
  <g filter="url(#sh)"><path d="M44 230 l10-6 10 6 v12 l-10 6 -10-6 z" fill="url(#ag)" stroke="#fb923c"/></g>
  <text class="hx" x="40" y="264">screenshot-capturer</text>
  <text class="band" x="250" y="104" fill="#ea580c">① DETECT</text>
  <g filter="url(#sh)"><rect x="250" y="120" width="200" height="92" rx="13" fill="url(#ag)" stroke="#fdba74"/></g>
  <text class="ph" x="270" y="154" fill="#0f172a">Find the PII</text>
  <text class="cap" x="270" y="176">tokens · keys · emails ·</text>
  <text class="cap" x="270" y="193">names · card numbers</text>
  <g filter="url(#sh)">
    <path d="M254 230 l10-6 10 6 v12 l-10 6 -10-6 z" fill="url(#ag)" stroke="#fb923c"/>
  </g>
  <text class="hx" x="250" y="264">sensitive-data-reviewer</text>
  <text class="band" x="490" y="104" fill="#ea580c">② REDACT</text>
  <g filter="url(#sh)"><rect x="490" y="120" width="200" height="92" rx="13" fill="url(#ag)" stroke="#fdba74"/></g>
  <text class="ph" x="510" y="154" fill="#0f172a">Blur or mask</text>
  <text class="cap" x="510" y="176">full blur for secrets,</text>
  <text class="cap" x="510" y="193">partial for illustrative</text>
  <g filter="url(#sh)">
    <path d="M494 230 l10-6 10 6 v12 l-10 6 -10-6 z" fill="url(#ag)" stroke="#fb923c"/>
  </g>
  <text class="hx" x="490" y="264">screenshot-redactor</text>
  <text class="band" x="730" y="96" fill="#dc2626">③ VERIFY — BEFORE WRITING</text>
  <g filter="url(#sh)"><rect x="730" y="112" width="210" height="108" rx="13" fill="url(#gt)" stroke="#ef4444" stroke-width="2.5"/></g>
  <text class="ph" x="750" y="146" fill="#b91c1c">Prove it's covered</text>
  <text class="cap" x="750" y="168" fill="#b91c1c">every flagged region re-checked</text>
  <text class="cap" x="750" y="185" fill="#b91c1c">can't confirm? nothing is written</text>
  <text class="band" x="980" y="104" fill="#16a34a">RESULT</text>
  <g filter="url(#sh)"><rect x="980" y="120" width="150" height="92" rx="13" fill="url(#ok)" stroke="#22c55e" stroke-width="2.5"/></g>
  <text class="ph" x="1000" y="154" fill="#15803d">✓ Safe image</text>
  <text class="cap" x="1000" y="176" fill="#15803d">raw stays gitignored</text>
  <text class="cap" x="1000" y="193" fill="#15803d">only redacted ships</text>
  <path d="M210 166 H242" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#mg)"/>
  <path d="M450 166 H482" fill="none" stroke="#fb923c" stroke-width="2.5" marker-end="url(#mo)"/>
  <path d="M690 166 H722" fill="none" stroke="#fb923c" stroke-width="2.5" marker-end="url(#mo)"/>
  <path d="M940 166 H972" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#mk)"/>
  <text class="cap" x="250" y="300" font-weight="700" fill="#9a3412">The un-redacted original is never committed. Coverage is verified before anything is written, not after.</text>
  <line x1="40" y1="330" x2="1140" y2="330" stroke="#e2e8f0"/>
  <path d="M42 360 l9-5.5 9 5.5 v11 l-9 5.5 -9-5.5 z" fill="url(#ag)" stroke="#fb923c"/>
  <text class="lg" x="66" y="370">AI agent</text>
  <rect x="146" y="356" width="18" height="16" rx="4" fill="url(#nt)" stroke="#cbd5e1"/>
  <text class="lg" x="170" y="370">stage</text>
  <text class="big" x="270" y="372" fill="#ea580c">3</text>
  <text class="lg" x="290" y="370">agents</text>
  <text class="big" x="376.0" y="372" fill="#b91c1c">1</text>
  <text class="lg" x="396.0" y="370">verify gate</text>
  <text class="big" x="512.0" y="372" fill="#15803d">0</text>
  <text class="lg" x="532.0" y="370">un-redacted images committed</text>
</svg>