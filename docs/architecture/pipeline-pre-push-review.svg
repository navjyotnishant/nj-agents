<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 400" width="1010" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif" role="img" aria-label="Scan first. Then review everything at once.. The secret scan runs alone and blocks on a hit — or on no scanner at all. Only a clean diff is ever shared with a review agent.">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#ffedd5"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef2f2"/><stop offset="1" stop-color="#fee2e2"/></linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="nt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/></marker>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>
  <style>
    .t{fill:#0f172a}.h1{font-size:21px;font-weight:700}.lede{font-size:13px;fill:#475569}
    .ph{font-size:15.5px;font-weight:670}.cap{font-size:10.5px;fill:#64748b}
    .band{font-size:9px;font-weight:700;letter-spacing:.10em;fill:#94a3b8}
    .hx{font-size:9.5px;font-weight:600;fill:#9a3412}.big{font-size:22px;font-weight:700}
    .lg{font-size:10.5px;fill:#64748b}.kick{font-size:9px;font-weight:700;letter-spacing:.10em}
    @media (prefers-color-scheme: dark){.t{fill:#e2e8f0}.lede{fill:#cbd5e1}.cap{fill:#94a3b8}.lg{fill:#94a3b8}.hx{fill:#fdba74}}
  </style>

  <path d="M14 13 Q505 9 996 14 Q1000 200 996 386 Q505 391 14 386 Q10 200 14 13 Z" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round" opacity="0.85"/>
  <text class="t h1" x="40" y="42">Scan first. Then review everything at once.</text>
  <text class="lede" x="40" y="68">The secret scan runs alone and blocks on a hit — or on no scanner at all. Only a clean diff is ever shared with a review agent.</text>
  <text class="band" x="40" y="104">YOUR CHANGES</text>
  <g filter="url(#sh)"><rect x="40" y="120" width="170" height="92" rx="13" fill="url(#nt)" stroke="#cbd5e1"/></g>
  <text class="ph" x="60" y="154" fill="#0f172a">The diff</text>
  <text class="cap" x="60" y="176">staged · unstaged ·</text>
  <text class="cap" x="60" y="193">unpushed commits</text>
  <text class="band" x="250" y="96" fill="#dc2626">① SECRET GATE — FIRST, ALONE</text>
  <g filter="url(#sh)"><rect x="250" y="112" width="210" height="108" rx="13" fill="url(#gt)" stroke="#ef4444" stroke-width="2.5"/></g>
  <text class="ph" x="270" y="146" fill="#b91c1c">Scan before sharing</text>
  <text class="cap" x="270" y="168" fill="#b91c1c">a real scanner, or BLOCK</text>
  <text class="cap" x="270" y="185" fill="#b91c1c">a hit → stops, shares nothing</text>
  <text class="band" x="500" y="104" fill="#ea580c">② FIVE DIMENSIONS — IN PARALLEL</text>
  <g filter="url(#sh)"><rect x="500" y="120" width="230" height="92" rx="13" fill="url(#ag)" stroke="#fdba74"/></g>
  <text class="ph" x="520" y="154" fill="#0f172a">Review, all at once</text>
  <text class="cap" x="520" y="176">each returns PASS · WARN ·</text>
  <text class="cap" x="520" y="193">BLOCK · SKIP</text>
  <g filter="url(#sh)">
    <path d="M504 230 l10-6 10 6 v12 l-10 6 -10-6 z" fill="url(#ag)" stroke="#fb923c"/>
    <path d="M538 230 l10-6 10 6 v12 l-10 6 -10-6 z" fill="url(#ag)" stroke="#fb923c"/>
    <path d="M572 230 l10-6 10 6 v12 l-10 6 -10-6 z" fill="url(#ag)" stroke="#fb923c"/>
    <path d="M606 230 l10-6 10 6 v12 l-10 6 -10-6 z" fill="url(#ag)" stroke="#fb923c"/>
    <path d="M640 230 l10-6 10 6 v12 l-10 6 -10-6 z" fill="url(#ag)" stroke="#fb923c"/>
  </g>
  <text class="hx" x="500" y="264">secrets · correctness · tests · deps · style</text>
  <text class="band" x="790" y="104" fill="#16a34a">③ AGGREGATE</text>
  <g filter="url(#sh)"><rect x="790" y="120" width="180" height="92" rx="13" fill="url(#ok)" stroke="#22c55e" stroke-width="2.5"/></g>
  <text class="ph" x="810" y="154" fill="#15803d">One verdict</text>
  <text class="cap" x="810" y="176" fill="#15803d">any BLOCK → BLOCK</text>
  <text class="cap" x="810" y="193" fill="#15803d">exit 1 stops the push</text>
  <path d="M210 166 H242" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#mg)"/>
  <path d="M460 166 H492" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mr)"/>
  <path d="M730 166 H782" fill="none" stroke="#fb923c" stroke-width="2.5" marker-end="url(#mo)"/>
  <text class="kick" x="462" y="150" fill="#dc2626">CLEAN</text>
  <text class="cap" x="500" y="300" font-weight="700" fill="#9a3412">Nothing reaches an agent until the scan clears — a missing scanner blocks too.</text>
  <g filter="url(#sh)"><rect x="40" y="240" width="410" height="80" rx="13" fill="#fcfdfe" stroke="#e2e8f0"/></g>
  <text class="cap" x="62" y="268" font-weight="700" fill="#334155">Cost-aware by default</text>
  <text class="cap" x="62" y="290">skips a dimension with nothing to review · on a re-run,</text>
  <text class="cap" x="62" y="307">only the dimensions that still have findings</text>
  <line x1="40" y1="330" x2="970" y2="330" stroke="#e2e8f0"/>
  <path d="M42 360 l9-5.5 9 5.5 v11 l-9 5.5 -9-5.5 z" fill="url(#ag)" stroke="#fb923c"/>
  <text class="lg" x="66" y="370">AI agent</text>
  <rect x="146" y="356" width="18" height="16" rx="4" fill="url(#nt)" stroke="#cbd5e1"/>
  <text class="lg" x="170" y="370">stage</text>
  <text class="big" x="270" y="372" fill="#ea580c">5</text>
  <text class="lg" x="290" y="370">agents</text>
  <text class="big" x="376.0" y="372" fill="#b91c1c">1</text>
  <text class="lg" x="396.0" y="370">hard gate</text>
  <text class="big" x="500.0" y="372" fill="#0f172a">4</text>
  <text class="lg" x="520.0" y="370">verdicts — PASS · WARN · BLOCK · SKIP</text>
</svg>