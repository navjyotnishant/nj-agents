<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif" role="img" aria-label="You invoke a skill; the skill orchestrates its agents. Agents never call each other, so the hierarchy is always one level deep.">
  <defs>
    <linearGradient id="gUser"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="gSkill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <linearGradient id="gAgent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#ffedd5"/></linearGradient>
    <linearGradient id="gOut"   x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="a"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/></marker>
  </defs>

  <style>
    .t{fill:#0f172a}
    .h1{font-size:22px;font-weight:700}
    .lede{font-size:13.5px;fill:#475569}
    .phase{font-size:16px;font-weight:670}
    .cap{font-size:11px;fill:#64748b}
    .band{font-size:9.5px;font-weight:700;letter-spacing:.10em;fill:#94a3b8}
    .hexlabel{font-size:10px;font-weight:600;fill:#9a3412}
    .cls{font-size:11.5px;font-weight:600;fill:#7c2d12}
    .n{font-size:13px;font-weight:700;fill:#ea580c}
    .big{font-size:24px;font-weight:700}
    .legend{font-size:10.5px;fill:#64748b}
    @media (prefers-color-scheme: dark){
      .t{fill:#e2e8f0}.lede{fill:#cbd5e1}.cap{fill:#94a3b8}.legend{fill:#94a3b8}
      .hexlabel{fill:#fdba74}.cls{fill:#fdba74}
    }
  </style>

  <path d="M14 13 Q600 9 1186 14 Q1190 262 1186 498 Q600 503 14 498 Q10 262 14 13 Z"
        fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round" opacity="0.85"/>
  <path d="M17 17 Q600 13 1183 18" fill="none" stroke="#0f172a" stroke-width="0.7" opacity="0.35"/>

  <text class="t h1" x="40" y="44">You call a skill. The skill runs the agents.</text>
  <text class="lede" x="40" y="70">Agents never call each other — the skill is always the orchestrator, so the hierarchy is exactly one level deep.</text>

  <!-- bands -->
  <text class="band" x="40"  y="108">YOU</text>
  <text class="band" x="228" y="108">THE SKILL — ORCHESTRATOR</text>
  <text class="band" x="560" y="108" fill="#ea580c">ITS AGENTS — ONE LEVEL, NEVER NESTED</text>
  <text class="band" x="1010" y="108" fill="#16a34a">RESULT</text>

  <!-- YOU -->
  <g filter="url(#sh)"><rect x="40" y="124" width="140" height="88" rx="14" fill="url(#gUser)" stroke="#93c5fd"/></g>
  <text class="t phase" x="60" y="158">/skill-name</text>
  <text class="cap" x="60" y="181">one command, in</text>
  <text class="cap" x="60" y="198">any git repo</text>

  <!-- SKILL -->
  <g filter="url(#sh)"><rect x="228" y="124" width="256" height="88" rx="14" fill="url(#gSkill)" stroke="#cbd5e1"/></g>
  <text class="t phase" x="250" y="158">Reads the repo, plans the run</text>
  <text class="cap" x="250" y="181">states the cost shape first · announces the</text>
  <text class="cap" x="250" y="198">roster · caps fix rounds at 2</text>

  <!-- AGENTS, grouped by class -->
  <g filter="url(#sh)"><rect x="560" y="124" width="392" height="256" rx="16" fill="#fffbf5" stroke="#fed7aa"/></g>

  <text class="cls" x="584" y="152">Authoring</text>
  <g filter="url(#sh)">
    <path d="M588 168 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M626 168 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M664 168 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M702 168 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M740 168 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M778 168 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M816 168 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M854 168 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M588 192 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M626 192 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M664 192 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M702 192 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M740 192 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M778 192 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M816 192 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
  </g>
  <text class="cap" x="584" y="231">blog · diagram · docs · screenshots · changelog · social</text>

  <text class="cls" x="584" y="267">Review</text>
  <g filter="url(#sh)">
    <path d="M588 283 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M626 283 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M664 283 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M702 283 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M740 283 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M778 283 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M816 283 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M854 283 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
  </g>
  <text class="cap" x="584" y="322">secrets · correctness · tests-build · deps · style · dead-code · gaps</text>

  <text class="cls" x="584" y="352">Workflow · PM · Social</text>
  <g filter="url(#sh)">
    <path d="M778 346 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M816 346 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
    <path d="M854 346 l11-6.5 11 6.5 v13 l-11 6.5 -11-6.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
  </g>


  <!-- what the orchestrator guarantees — fills the left column, and is the point -->
  <g filter="url(#sh)"><rect x="40" y="240" width="444" height="140" rx="14" fill="#fcfdfe" stroke="#e2e8f0"/></g>
  <text class="cls" x="64" y="270" fill="#334155">Every run, whatever the skill</text>
  <text class="cap" x="64" y="296">· states its cost before spawning anything</text>
  <text class="cap" x="64" y="316">· announces the roster, then marks each agent as it lands</text>
  <text class="cap" x="64" y="336">· caps fix rounds at 2, then asks before spending more</text>
  <text class="cap" x="64" y="356">· writes the artifact and PROPOSES the commit — never runs git</text>

  <!-- RESULT -->
  <g filter="url(#sh)"><rect x="1010" y="124" width="150" height="88" rx="14" fill="url(#gOut)" stroke="#22c55e" stroke-width="2.5"/></g>
  <text class="phase" x="1032" y="158" fill="#15803d">✓ A verdict</text>
  <text class="cap" x="1032" y="181" fill="#15803d">or one artifact —</text>
  <text class="cap" x="1032" y="198" fill="#15803d">commit PROPOSED</text>

  <!-- FLOW -->
  <path d="M180 168 H220" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M484 168 H552" fill="none" stroke="#fb923c" stroke-width="2.5" marker-end="url(#ao)"/>
  <text class="band" x="492" y="160" fill="#ea580c">SPAWNS</text>
  <path d="M952 168 H1002" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- the rule worth remembering -->
  <text class="cap" x="584" y="402" font-weight="700" fill="#9a3412">An agent never spawns another agent. Every fan-out you see is the skill's.</text>

  <!-- legend + numbers: one baseline each, explicit x for every pair -->
  <line x1="40" y1="440" x2="1160" y2="440" stroke="#e2e8f0"/>

  <path d="M42 474 l9-5.5 9 5.5 v11 l-9 5.5 -9-5.5 z" fill="url(#gAgent)" stroke="#fb923c"/>
  <text class="legend" x="66" y="484">AI agent</text>
  <rect x="146" y="470" width="18" height="16" rx="4" fill="url(#gSkill)" stroke="#cbd5e1"/>
  <text class="legend" x="170" y="484">skill</text>
  <rect x="222" y="470" width="18" height="16" rx="4" fill="url(#gUser)" stroke="#93c5fd"/>
  <text class="legend" x="246" y="484">you</text>

  <!-- Skill/agent/pipeline tallies deliberately live UNDER this image, not in it:
       generated from the file tree, they cannot go stale. "1 level deep" stays —
       it is a structural invariant of the design, not a count. -->
  <text class="big" x="330" y="486" fill="#15803d">1</text>
  <text class="legend" x="346" y="484">level deep, always — an agent never calls another agent</text>
</svg>
