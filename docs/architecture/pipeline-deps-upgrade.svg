<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 390" width="1030" height="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif" role="img" aria-label="What's outdated, and what it will cost you.. Surveys the whole manifest, classifies each upgrade by semver risk, and proposes an order. It never runs the upgrade or edits the manifest.">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#ffedd5"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef2f2"/><stop offset="1" stop-color="#fee2e2"/></linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="nt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/></marker>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>
  <style>
    .t{fill:#0f172a}.h1{font-size:21px;font-weight:700}.lede{font-size:13px;fill:#475569}
    .ph{font-size:15.5px;font-weight:670}.cap{font-size:10.5px;fill:#64748b}
    .band{font-size:9px;font-weight:700;letter-spacing:.10em;fill:#94a3b8}
    .hx{font-size:9.5px;font-weight:600;fill:#9a3412}.big{font-size:22px;font-weight:700}
    .lg{font-size:10.5px;fill:#64748b}.kick{font-size:9px;font-weight:700;letter-spacing:.10em}
    @media (prefers-color-scheme: dark){.t{fill:#e2e8f0}.lede{fill:#cbd5e1}.cap{fill:#94a3b8}.lg{fill:#94a3b8}.hx{fill:#fdba74}}
  </style>

  <path d="M14 13 Q515 9 1016 14 Q1020 195 1016 376 Q515 381 14 376 Q10 195 14 13 Z" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round" opacity="0.85"/>
  <text class="t h1" x="40" y="42">What's outdated, and what it will cost you.</text>
  <text class="lede" x="40" y="68">Surveys the whole manifest, classifies each upgrade by semver risk, and proposes an order. It never runs the upgrade or edits the manifest.</text>
  <text class="band" x="40" y="104">MANIFEST</text>
  <g filter="url(#sh)"><rect x="40" y="120" width="190" height="92" rx="13" fill="url(#nt)" stroke="#cbd5e1"/></g>
  <text class="ph" x="60" y="154" fill="#0f172a">Your dependencies</text>
  <text class="cap" x="60" y="176">package.json · pyproject</text>
  <text class="cap" x="60" y="193">Cargo.toml · go.mod</text>
  <text class="band" x="280" y="104" fill="#ea580c">① SURVEY</text>
  <g filter="url(#sh)"><rect x="280" y="120" width="210" height="92" rx="13" fill="url(#ag)" stroke="#fdba74"/></g>
  <text class="ph" x="300" y="154" fill="#0f172a">Find what's stale</text>
  <text class="cap" x="300" y="176">detects the package manager</text>
  <text class="cap" x="300" y="193">zero-network by default</text>
  <g filter="url(#sh)">
    <path d="M284 230 l10-6 10 6 v12 l-10 6 -10-6 z" fill="url(#ag)" stroke="#fb923c"/>
  </g>
  <text class="hx" x="280" y="264">deps-upgrade</text>
  <text class="band" x="540" y="104" fill="#ea580c">② CLASSIFY</text>
  <g filter="url(#sh)"><rect x="540" y="120" width="210" height="92" rx="13" fill="url(#ag)" stroke="#fdba74"/></g>
  <text class="ph" x="560" y="154" fill="#0f172a">Rank the risk</text>
  <text class="cap" x="560" y="176">patch · minor · major, plus</text>
  <text class="cap" x="560" y="193">breaking-change signals</text>
  <g filter="url(#sh)">
    <path d="M544 230 l10-6 10 6 v12 l-10 6 -10-6 z" fill="url(#ag)" stroke="#fb923c"/>
  </g>
  <text class="hx" x="540" y="264">dependency-reviewer</text>
  <text class="band" x="800" y="104" fill="#16a34a">RESULT</text>
  <g filter="url(#sh)"><rect x="800" y="120" width="190" height="92" rx="13" fill="url(#ok)" stroke="#22c55e" stroke-width="2.5"/></g>
  <text class="ph" x="820" y="154" fill="#15803d">✓ A plan</text>
  <text class="cap" x="820" y="176" fill="#15803d">safe patches first,</text>
  <text class="cap" x="820" y="193" fill="#15803d">flagged majors last</text>
  <path d="M230 166 H272" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#mg)"/>
  <path d="M490 166 H532" fill="none" stroke="#fb923c" stroke-width="2.5" marker-end="url(#mo)"/>
  <path d="M750 166 H792" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#mk)"/>
  <text class="cap" x="280" y="290" font-weight="700" fill="#9a3412">Distinct from /review-dependencies, which reviews the dependency changes in a diff rather than the whole manifest.</text>
  <line x1="40" y1="320" x2="990" y2="320" stroke="#e2e8f0"/>
  <path d="M42 350 l9-5.5 9 5.5 v11 l-9 5.5 -9-5.5 z" fill="url(#ag)" stroke="#fb923c"/>
  <text class="lg" x="66" y="360">AI agent</text>
  <rect x="146" y="346" width="18" height="16" rx="4" fill="url(#nt)" stroke="#cbd5e1"/>
  <text class="lg" x="170" y="360">stage</text>
  <text class="big" x="270" y="362" fill="#ea580c">2</text>
  <text class="lg" x="290" y="360">agents</text>
  <text class="big" x="376.0" y="362" fill="#0f172a">3</text>
  <text class="lg" x="396.0" y="360">risk classes</text>
  <text class="big" x="518.0" y="362" fill="#15803d">0</text>
  <text class="lg" x="538.0" y="360">packages upgraded for you</text>
</svg>